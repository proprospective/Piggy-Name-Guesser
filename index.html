<style>
  :root {
    --bg: #14101c;
    --bg-2: #1d1729;
    --card: #221a30;
    --card-2: #2a213d;
    --border: #3a2c4f;
    --border-2: #4d3a6b;
    --fg: #f5eefb;
    --muted: #9a87b3;
    --accent: #ff3c6e;
    --accent-2: #ff8a3d;
    --good: #4ade80;
    --bad: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    padding: 12px 20px 20px;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255, 60, 110, 0.14), transparent 38%),
      radial-gradient(circle at 88% 92%, rgba(255, 138, 61, 0.10), transparent 38%),
      radial-gradient(circle at 50% 50%, rgba(70, 50, 100, 0.06), transparent 60%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .bg-decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.22; animation: drift 22s ease-in-out infinite alternate; }
  .blob-1 { width: 360px; height: 360px; background: #ff3c6e; top: -120px; left: -120px; }
  .blob-2 { width: 300px; height: 300px; background: #ff8a3d; bottom: -100px; right: -100px; animation-duration: 28s; animation-direction: alternate-reverse; }
  .blob-3 { width: 240px; height: 240px; background: #7a3fff; top: 40%; left: 60%; animation-duration: 30s; opacity: 0.15; }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(80px, 60px) scale(1.2); } }

  .header {
    display: grid;
    grid-template-columns: minmax(240px, 320px) 1fr auto;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }
  .input-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; font-weight: 700; }
  .input-box {
    width: 100%; padding: 10px 14px;
    background: rgba(34, 26, 48, 0.85); backdrop-filter: blur(8px);
    border: 2px solid var(--border); border-radius: 10px;
    color: var(--fg); font-family: inherit; font-size: 13px; font-weight: 500;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .input-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 60, 110, 0.18), 0 6px 20px rgba(255, 60, 110, 0.12); }
  .input-box::placeholder { color: var(--muted); }
  .input-box:disabled { opacity: 0.5; cursor: not-allowed; }
  .input-box.shake { animation: shake 0.4s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .title-section { text-align: center; padding-top: 2px; }
  .title { font-family: 'Bungee', cursive; font-size: 30px; color: var(--accent); letter-spacing: 1.2px; text-shadow: 0 0 28px rgba(255, 60, 110, 0.55), 0 0 60px rgba(255, 60, 110, 0.25), 2px 2px 0 rgba(0,0,0,0.4); line-height: 1; }
  .stats-section { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .stat-box { background: rgba(34, 26, 48, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; text-align: center; min-width: 70px; }
  .stat-label { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }
  .stat-value { font-size: 16px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; margin-top: 1px; line-height: 1.1; }
  .stat-value.running { color: var(--accent-2); }
  .stat-value.running::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); margin-right: 5px; vertical-align: middle; animation: blink 1s infinite; box-shadow: 0 0 8px var(--accent-2); }
  @keyframes blink { 50% { opacity: 0.3; } }
  .subscribe-banner { background: linear-gradient(90deg, rgba(255, 0, 0, 0.16), rgba(255, 60, 110, 0.1), rgba(255, 0, 0, 0.16)); border: 1px solid rgba(255, 0, 0, 0.32); border-radius: 8px; padding: 6px 10px; font-size: 11px; color: var(--fg); display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .subscribe-banner svg { flex-shrink: 0; }
  .subscribe-banner a { color: #ff5a5a; font-weight: 700; text-decoration: none; transition: color 0.15s; }
  .subscribe-banner a:hover { color: #ff8a8a; text-decoration: underline; }
  .top-btn { background: var(--card); color: var(--fg); border: 1px solid var(--border-2); padding: 8px 14px; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; transition: all 0.2s; }
  .top-btn:hover { border-color: var(--accent); background: var(--card-2); transform: translateY(-2px); }
  .top-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 12px rgba(255, 60, 110, 0.4); }
  .give-up-btn { background: linear-gradient(135deg, #ff3c6e, #ff5252); color: white; border: none; box-shadow: 0 4px 16px rgba(255, 60, 110, 0.28); }
  .give-up-btn:hover { box-shadow: 0 8px 28px rgba(255, 60, 110, 0.4); border: none; }
  .give-up-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

  .progress { height: 4px; background: var(--card); border-radius: 3px; margin-bottom: 14px; overflow: hidden; position: relative; z-index: 1; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1); border-radius: 3px; box-shadow: 0 0 12px rgba(255, 60, 110, 0.55); }

  .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; position: relative; z-index: 1; align-items: start; }
  .section { width: 100%; }
  .section-title { font-family: 'Bungee', cursive; font-size: 14px; color: var(--accent-2); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 2px solid var(--border); text-shadow: 0 0 12px rgba(255, 138, 61, 0.3); }
  .section-grid { display: flex; flex-wrap: wrap; gap: 6px; }

  .skin-group {
    background: rgba(34, 26, 48, 0.3); backdrop-filter: blur(4px);
    border: 1px solid var(--border); border-radius: 8px; padding: 3px;
    display: flex; flex-direction: column; gap: 3px;
    transition: all 0.3s ease;
    flex: 1 1 120px; min-width: 120px;
  }
  .skin-group.complete { border-color: var(--good); background: rgba(74, 222, 128, 0.05); box-shadow: 0 0 0 1px rgba(74, 222, 128, 0.2); }
  
  .main-skin-box, .alt-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-weight: 600; transition: all 0.3s ease; position: relative; overflow: hidden; line-height: 1.2; overflow-wrap: break-word;
  }
  .main-skin-box {
    background: rgba(34, 26, 48, 0.72); border: 1px dashed var(--border); border-radius: 5px;
    padding: 8px 4px; min-height: 32px; font-size: 11px; width: 100%;
    color: var(--muted);
  }
  .alts-container { display: flex; flex-wrap: wrap; gap: 3px; }
  .alt-box {
    background: rgba(34, 26, 48, 0.5); border: 1px dashed var(--border); border-radius: 4px;
    flex: 1 1 40px; min-height: 24px; font-size: 9.5px; padding: 5px 3px;
    color: var(--muted);
  }

  .main-skin-box.empty .placeholder, .alt-box.empty .placeholder { font-size: 12px; opacity: 0.3; font-weight: 400; }
  .main-skin-box.empty .hint-text, .alt-box.empty .hint-text { display: none; font-size: 8px; color: var(--accent-2); opacity: 0.85; font-weight: 600; text-align: center; line-height: 1; word-break: break-word; max-width: 100%; margin-top: 1px; }
  
  .main-grid.hints-active .main-skin-box.empty { justify-content: center; gap: 1px; }
  .main-grid.hints-active .main-skin-box.empty .placeholder { font-size: 10px; opacity: 0.5; }
  .main-grid.hints-active .main-skin-box.empty .hint-text { display: block; }
  
  .main-grid.hints-active .alt-box.empty { justify-content: center; gap: 1px; }
  .main-grid.hints-active .alt-box.empty .placeholder { font-size: 10px; opacity: 0.5; }
  .main-grid.hints-active .alt-box.empty .hint-text { display: block; font-size: 7.5px; }

  .main-skin-box.filled, .alt-box.filled {
    background: linear-gradient(135deg, rgba(255, 60, 110, 0.22), rgba(255, 138, 61, 0.1));
    border: 1px solid var(--accent); color: var(--fg);
    box-shadow: 0 0 0 1px rgba(255, 60, 110, 0.4), 0 6px 18px rgba(255, 60, 110, 0.2);
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .main-skin-box.missed, .alt-box.missed {
    background: rgba(255, 77, 77, 0.08); border: 1px dashed rgba(255, 77, 77, 0.55); color: #ff8a8a;
  }
  @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

  .modal { position: fixed; inset: 0; background: rgba(8, 5, 14, 0.85); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal.show { display: flex; animation: fadeIn 0.3s; }
  .modal-content { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 18px; padding: 32px; max-width: 820px; width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-title { font-family: 'Bungee', cursive; font-size: 28px; color: var(--accent); text-align: center; margin-bottom: 6px; letter-spacing: 1px; text-shadow: 0 0 24px rgba(255, 60, 110, 0.4); }
  .modal-subtitle { text-align: center; color: var(--muted); margin-bottom: 22px; font-size: 14px; }
  .modal-stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
  .modal-stats .stat-box { min-width: 110px; background: var(--card); padding: 8px 16px; }
  .modal-stats .stat-value { font-size: 20px; }
  .missed-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.8px; margin-bottom: 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .missed-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .missed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .missed-item { background: rgba(255, 77, 77, 0.08); border: 1px solid rgba(255, 77, 77, 0.3); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #ff8a8a; font-weight: 500; }
  .all-done { text-align: center; color: var(--good); padding: 28px 16px; grid-column: 1/-1; font-weight: 600; font-size: 15px; }
  .modal-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .modal-btn { background: var(--card); color: var(--fg); border: 1px solid var(--border-2); padding: 12px 26px; border-radius: 10px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
  .modal-btn:hover { border-color: var(--accent); background: var(--card-2); transform: translateY(-2px); }
  .modal-btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: white; box-shadow: 0 4px 16px rgba(255, 60, 110, 0.32); }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(42, 33, 61, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--border-2); color: var(--fg); padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.4); max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--good); color: #7df0a0; }
  .toast.error { border-color: var(--bad); color: #ff8080; }

  .confetti { position: fixed; top: -12px; width: 10px; height: 16px; z-index: 300; animation: confetti-fall linear forwards; pointer-events: none; border-radius: 1px; }
  @keyframes confetti-fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 1100px) { .header { grid-template-columns: 1fr; gap: 12px; } .title-section { order: -1; } .stats-section { justify-content: center; } }
  @media (max-width: 600px) { body { padding: 10px; } .title { font-size: 24px; } .modal-content { padding: 22px; } .modal-title { font-size: 22px; } }
</style>
</head>

  // Parse Data
  const sections = {};
  let currentSection = "";
  const lines = RAW_DATA.split('\n').map(l => l.trim()).filter(Boolean);
  lines.forEach(line => {
    if (/^\d+\.\s/.test(line)) {
      currentSection = line.replace(/^\d+\.\s*/, '');
      sections[currentSection] = { order: [], groups: {} };
    } else if (line && currentSection) {
      const parts = line.split('—');
      let name = parts[0].trim();
      const obtain = parts[1] ? parts[1].trim() : 'N/A';
      
      // Rename Penny to Piggy (Penny) as requested
      if (name === 'Penny') name = 'Piggy (Penny)';
      
      let baseName = name;
      if (name === 'Piggy (Penny)') {
        baseName = 'Piggy';
      } else if (name === 'Tigry TSP (Alternate)') {
        baseName = 'Tigry';
      } else if (name.includes(' (')) {
        baseName = name.split(' (')[0].trim();
      }
      
      if (!sections[currentSection].groups[baseName]) {
        sections[currentSection].groups[baseName] = { base: baseName, skins: [] };
        sections[currentSection].order.push(baseName);
      }
      sections[currentSection].groups[baseName].skins.push({ name, obtain });
    }
  });

  // Flatten skin list for lookup
  const flatSkins = [];
  for (const sec in sections) {
    sections[sec].order.forEach(baseName => {
      const group = sections[sec].groups[baseName];
      group.skins.forEach((skin, i) => {
        skin.section = sec;
        skin.base = baseName;
        skin.isMain = i === 0;
        flatSkins.push(skin);
      });
    });
  }
  const TOTAL = flatSkins.length;

  // Normalize - removes dots, parenthesis, accents, emojis for forgiving typing
  function normalize(str) {
    return str.toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[.\(\)]/g, '')
      .replace(/\s*\/\s*/g, '/')
      .replace(/[^\w\s\-\/]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  const skinMap = new Map();
  flatSkins.forEach((s, idx) => {
    s.idx = idx;
    skinMap.set(normalize(s.name), s);
  });

  let guessed = new Set();
  let startTime = null, endTime = null, timerInterval = null, givenUp = false;

  // DOM refs
  const $input = document.getElementById('skinInput');
  const $timer = document.getElementById('timer');
  const $count = document.getElementById('count');
  const $mainGrid = document.getElementById('mainGrid');
  const $giveUpBtn = document.getElementById('giveUpBtn');
  const $infoBtn = document.getElementById('infoBtn');
  const $progressFill = document.getElementById('progressFill');
  const $modal = document.getElementById('modal');
  const $modalTitle = document.getElementById('modalTitle');
  const $modalSubtitle = document.getElementById('modalSubtitle');
  const $modalCount = document.getElementById('modalCount');
  const $modalTime = document.getElementById('modalTime');
  const $modalMissed = document.getElementById('modalMissed');
  const $missedList = document.getElementById('missedList');
  const $playAgainBtn = document.getElementById('playAgainBtn');
  const $closeModalBtn = document.getElementById('closeModalBtn');
  const $toast = document.getElementById('toast');

  function buildGrid() {
    $mainGrid.innerHTML = '';
    for (const sec in sections) {
      const sectionEl = document.createElement('div');
      sectionEl.className = 'section';
      sectionEl.innerHTML = `<div class="section-title">${sec}</div><div class="section-grid" id="grid-${sec}"></div>`;
      $mainGrid.appendChild(sectionEl);
      
      const gridEl = sectionEl.querySelector('.section-grid');
      sections[sec].order.forEach(baseName => {
        const group = sections[sec].groups[baseName];
        const groupEl = document.createElement('div');
        groupEl.className = 'skin-group';
        groupEl.dataset.base = baseName;
        
        // Main skin box (the BIG BOX)
        const main = group.skins[0];
        const mainBox = document.createElement('div');
        mainBox.className = 'main-skin-box empty';
        mainBox.dataset.skinId = main.idx;
        mainBox.dataset.name = main.name;
        mainBox.innerHTML = `<span class="placeholder">?</span><span class="hint-text">${main.obtain}</span>`;
        groupEl.appendChild(mainBox);
        
        // Alt boxes (the SMALL BOXES inside)
        if (group.skins.length > 1) {
          const altsContainer = document.createElement('div');
          altsContainer.className = 'alts-container';
          for (let i = 1; i < group.skins.length; i++) {
            const alt = group.skins[i];
            const altBox = document.createElement('div');
            altBox.className = 'alt-box empty';
            altBox.dataset.skinId = alt.idx;
            altBox.dataset.name = alt.name;
            altBox.innerHTML = `<span class="placeholder">?</span><span class="hint-text">${alt.obtain}</span>`;
            altsContainer.appendChild(altBox);
          }
          groupEl.appendChild(altsContainer);
        }
        gridEl.appendChild(groupEl);
      });
    }
  }

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  function updateTimer() { if (!startTime) return; $timer.textContent = formatTime((endTime || Date.now()) - startTime); }
  function startTimer() { if (timerInterval) return; startTime = Date.now(); $timer.classList.add('running'); timerInterval = setInterval(updateTimer, 200); }
  function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; endTime = Date.now(); $timer.classList.remove('running'); } }

  function updateCount() {
    $count.textContent = `${guessed.size}/${TOTAL}`;
    $progressFill.style.width = ((guessed.size / TOTAL) * 100) + '%';
  }

  function markGuessed(idx) {
    const box = $mainGrid.querySelector(`[data-skin-id="${idx}"]`);
    if (!box) return;
    const skin = flatSkins[idx];
    box.classList.remove('empty');
    box.classList.add('filled');
    box.innerHTML = skin.name;
    
    // Check if group is complete
    const groupEl = box.closest('.skin-group');
    if (groupEl) {
      const allBoxes = groupEl.querySelectorAll('.main-skin-box, .alt-box');
      const allFilled = Array.from(allBoxes).every(b => b.classList.contains('filled'));
      if (allFilled) groupEl.classList.add('complete');
    }
  }

  let toastTimeout;
  function showToast(message, type = '') {
    $toast.textContent = message;
    $toast.className = 'toast show ' + type;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { $toast.classList.remove('show'); }, 1600);
  }
  function shakeInput() { $input.classList.remove('shake'); void $input.offsetWidth; $input.classList.add('shake'); }

  function celebrate() {
    const colors = ['#ff3c6e', '#ff8a3d', '#4ade80', '#f5eefb', '#ffd84d'];
    for (let i = 0; i < 100; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = Math.random() * 0.5 + 's';
      c.style.animationDuration = (2 + Math.random() * 2.2) + 's';
      c.style.width = (8 + Math.random() * 6) + 'px';
      c.style.height = (12 + Math.random() * 8) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
  }

  function handleSubmit() {
    if (givenUp) return;
    const value = $input.value.trim();
    if (!value) return;
    const key = normalize(value);
    const match = skinMap.get(key);
    
    if (match && !guessed.has(match.idx)) {
      guessed.add(match.idx);
      markGuessed(match.idx);
      if (!startTime) startTimer();
      updateCount();
      showToast(`Got it: ${match.name}`, 'success');
      $input.value = '';
      
      if (guessed.size === TOTAL) {
        stopTimer();
        $input.disabled = true;
        $giveUpBtn.disabled = true;
        $giveUpBtn.textContent = 'Complete';
        celebrate();
        setTimeout(() => showModal(true), 700);
      }
    } else if (match && guessed.has(match.idx)) {
      showToast('Already got that one!', 'error');
      shakeInput();
    } else {
      showToast('Nope, not a match', 'error');
      shakeInput();
    }
  }

  function showModal(won = false) {
    const missed = flatSkins.filter(s => !guessed.has(s.idx));
    $modalCount.textContent = `${guessed.size}/${TOTAL}`;
    $modalTime.textContent = startTime ? formatTime((endTime || Date.now()) - startTime) : '00:00';
    $modalMissed.textContent = missed.length;
    $missedList.innerHTML = '';
    
    if (missed.length === 0) {
      $missedList.innerHTML = '<div class="all-done">You got every single one. Pure mastery.</div>';
    } else {
      missed.forEach(s => {
        const item = document.createElement('div');
        item.className = 'missed-item';
        item.textContent = s.name;
        $missedList.appendChild(item);
      });
    }
    
    $modalTitle.textContent = won ? 'You Did It!' : 'Game Over';
    $modalSubtitle.textContent = won ? 'You named all the skins. Legendary.' : `You got ${guessed.size} of ${TOTAL} skins.`;
    
    if (!won) {
      // Reveal missed on grid
      $mainGrid.querySelectorAll('.main-skin-box.empty, .alt-box.empty').forEach(box => {
        box.classList.remove('empty');
        box.classList.add('missed');
        box.innerHTML = box.dataset.name;
      });
    }
    $modal.classList.add('show');
  }

  function hideModal() { $modal.classList.remove('show'); }
  function reset() {
    guessed = new Set(); startTime = null; endTime = null; givenUp = false;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    $timer.textContent = '00:00'; $timer.classList.remove('running');
    updateCount(); buildGrid();
    $input.value = ''; $input.disabled = false;
    $giveUpBtn.disabled = false; $giveUpBtn.textContent = 'Give Up';
    hideModal(); $input.focus();
  }

  $input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleSubmit(); } });
  $giveUpBtn.addEventListener('click', () => {
    if (givenUp) return;
    if (guessed.size === 0) { showToast('Type at least one skin first!', 'error'); shakeInput(); return; }
    givenUp = true; stopTimer();
    $input.disabled = true; $giveUpBtn.disabled = true; $giveUpBtn.textContent = 'Over';
    showModal(false);
  });
  
  // Hint Toggle
  $infoBtn.addEventListener('click', () => {
    $mainGrid.classList.toggle('hints-active');
    $infoBtn.classList.toggle('active');
    $infoBtn.textContent = $mainGrid.classList.contains('hints-active') ? 'Skin Info (ON)' : 'Skin Info (Hint)';
    $input.focus();
  });

  $playAgainBtn.addEventListener('click', reset);
  $closeModalBtn.addEventListener('click', hideModal);
  $modal.addEventListener('click', (e) => { if (e.target === $modal) hideModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($modal.classList.contains('show')) hideModal();
    }
  });
  document.addEventListener('click', (e) => {
    if ($modal.classList.contains('show')) return;
    if (e.target.closest('a')) return; // allow clicking the youtube link without refocusing
    if (!$input.disabled) $input.focus();
  });

  // Init
  buildGrid();
  updateCount();
  $input.focus();
</script>
</body>
